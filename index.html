    font-size: .97rem;
  }

    color: #1d1d1f;
    border-radius: 10px;
    border: 1px solid #e0e0e5;
    padding: 4px 14px;
    font-size: .96rem;
    transition: background .13s;
  }
  .apple-btn:hover {
    background: #e5e5ea;
  }
  .apple-input, select {

    border: 1px solid #e0e0e5;
    border-radius: 8px;
    padding: 6px 10px;

  }

  }

    background: #b2d7ff;

  }

  main {
    display: flex;
    flex: 1;

  }
  section {

  }
  .overflow-y-auto {

  }

    }

  </section>

    <div class="bg-white rounded shadow p-2 flex-1 overflow-y-auto">

      <ul id="selectedFeatures" class="text-sm list-disc list-inside"></ul>
    </div>

  <section class="w-1/2 p-2">

</main>
<footer class="h-10 bg-gray-200 text-xs flex items-center px-4">

</footer>


<!-- 말풍선 스타일 GPT 대화 모달 -->
<!-- 수정된 chatModal 구조 (100% 동작 보장) -->
<!-- 완전한 대체용 Chat Modal -->
<div id="chatModal"
     class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-start justify-center overflow-y-auto py-8">
    
  <div class="bg-white w-full max-w-2xl rounded-xl shadow-xl p-4 flex flex-col overflow-hidden"
       style="max-height: 90vh;">

    <div class="text-lg font-semibold mb-2">🧠 Chat Micro</div>

    <div id="chatMessages"
         class="overflow-y-auto flex flex-col space-y-2 border rounded p-3 bg-gray-50 text-sm"
         style="height: 60vh;">
      <div class="bot-msg">안녕하세요! 어떤 디바이스를 만들고 싶으신가요?</div>
    </div>

    <div class="flex mt-3 gap-2">
      <input id="chatInput" type="text" placeholder=" "
             class="flex-1 p-2 border rounded text-sm" />
      <button id="chatSendBtn"
              class="px-4 py-2 bg-blue-600 text-white rounded text-sm">Send</button>
              
    </div>

    <div class="flex justify-end mt-3 gap-2">
      <button id="chatCancelBtn"
              class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200 text-sm">Close</button>
      <button id="chatApplyBtn"
              class="px-3 py-1 border rounded bg-green-600 hover:bg-green-700 text-white text-sm">Apply</button>
              
    <button id="chatResetBtn"
    class="px-3 py-1 border rounded bg-red-600 hover:bg-red-700 text-white text-sm">Reset
         </button>
    </div>
  </div>
</div>

let selectedFeatures = new Set();
let allExpanded = false;
let allSelected = false;

function getAllPackageDeps(pkg,visited=new Set()) {
  if(visited.has(pkg))return[];
  visited.add(pkg);
  let deps=[];
  (packageDependencies[pkg]||[]).forEach(dep=>{
    deps.push(dep);
    deps=deps.concat(getAllPackageDeps(dep,visited));
  });
  return deps;
}

function getFeaturesByPackage(pkg) {
  let result=[];
  categories.forEach(cat=>{
    cat.features.forEach(f=>{
      if(f.requiredPackages.includes(pkg)) result.push(f.id);
    });
  });
  return result;
}

function syncFeatureSelection(changedFeatureId,checked) {
  if(checked){
    const feature=categories.flatMap(c=>c.features).find(f=>f.id===changedFeatureId);
    if(!feature) return;
    let packagesToCheck=new Set(feature.requiredPackages);
    [...packagesToCheck].forEach(pkg=>{
      getAllPackageDeps(pkg).forEach(depPkg=>packagesToCheck.add(depPkg));
    });
    packagesToCheck.forEach(pkg=>{
      getFeaturesByPackage(pkg).forEach(fid=>{
        selectedFeatures.add(fid);
      });
    });
  } else {
    selectedFeatures.delete(changedFeatureId);
  }
  updateUI();
  updateCheckboxes();
}

function updateCategoryCheckboxStates(){
  categories.forEach(cat=>{
    const catCheckbox=document.querySelector(`input[type="checkbox"][data-cat='${cat.id}']`);
    if(!catCheckbox) return;
    const allFeatureIds=cat.features.map(f=>f.id);
    const checkedCount=allFeatureIds.filter(fid=>selectedFeatures.has(fid)).length;
    catCheckbox.checked=checkedCount===allFeatureIds.length;
    catCheckbox.indeterminate=checkedCount>0 && checkedCount<allFeatureIds.length;
  });
}

function updateCheckboxes(){
  const container=document.getElementById('featureList');
  container.querySelectorAll('input[type="checkbox"][data-feature]').forEach(cb=>{
    cb.checked=selectedFeatures.has(cb.dataset.feature);
  });
  updateCategoryCheckboxStates();
}

function updateUI(){
  const featureUl=document.getElementById('selectedFeatures');
  const packageUl=document.getElementById('packageList');
  const depUl=document.getElementById('dependencyList');
  const statusText=document.getElementById('statusText');

  featureUl.innerHTML='';
  packageUl.innerHTML='';
  depUl.innerHTML='';

  const packages=new Set();
  selectedFeatures.forEach(fid=>{
    const feature=categories.flatMap(c=>c.features).find(f=>f.id===fid);
    if(feature){
      featureUl.innerHTML+=`<li>${feature.name}</li>`;
      feature.requiredPackages.forEach(pkg=>packages.add(pkg));
    }
  });

  let totalSize=0;
  packages.forEach(pkg=>{
    packageUl.innerHTML+=`<li>${pkg}</li>`;
    (packageDependencies[pkg]||[]).forEach(dep=>{
      depUl.innerHTML+=`<li>${pkg} → ${dep}</li>`;
    });
    totalSize+=5;
  });

  document.getElementById('imageSize').innerText=`${totalSize} MB`;
  const totalFeatures=categories.reduce((acc,c)=>acc+c.features.length,0);
  const totalPackages=Object.keys(packageDependencies).length;
  statusText.innerText=`${selectedFeatures.size} / ${totalFeatures} features selected | ${packages.size} / ${totalPackages} packages`;

  drawGraph(packages);
}

function drawGraph(pkgs){
  const nodes=[],edges=[];
  const added=new Set();
  pkgs.forEach(pkg=>{
    if(!added.has(pkg)){
      nodes.push({id:pkg,label:pkg});
      added.add(pkg);
    }
    (packageDependencies[pkg]||[]).forEach(dep=>{
      if(!added.has(dep)){
        nodes.push({id:dep,label:dep});
        added.add(dep);
      }
      edges.push({ from: pkg, to: dep, arrows: 'to' });
    });
  });
  const container=document.getElementById('graph');
  const data={nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)};
  new vis.Network(container,data,{
    nodes:{shape:'box'},
    physics:{enabled:true}
  });
}

function renderFeatureList(){
  const container=document.getElementById('featureList');
  container.innerHTML='';

  categories.forEach(cat=>{
    const section=document.createElement('div');
    section.className='mb-4';

    const header=document.createElement('div');
    header.className='flex items-center justify-between cursor-pointer';
    header.innerHTML=`<div class="flex items-center space-x-2">
      <span class="toggle-icon">${allExpanded ? '▼' : '▶'}</span>
      <span>${cat.icon}</span>
      <span class="font-medium">${cat.name}</span>
    </div>
    <input type="checkbox" data-cat="${cat.id}" class="w-5 h-5"/>`;

    const body=document.createElement('div');
    body.className='ml-6 mt-2 space-y-1';
    body.dataset.catBody=cat.id;
    body.style.display=allExpanded ? 'block' : 'none';

    cat.features.forEach(f=>{
      const row=document.createElement('div');
      row.className='flex items-center justify-between';
      row.innerHTML=`<div class="flex items-center space-x-2">
        <span>${f.icon}</span><span>${f.name}</span>
      </div>
      <input type="checkbox" data-feature="${f.id}" class="w-5 h-5" />`;
      body.appendChild(row);
    });

    header.querySelector('.toggle-icon').addEventListener('click',()=>{
      const current=body.style.display;
      body.style.display=current==='none' ? 'block' : 'none';
      header.querySelector('.toggle-icon').textContent=body.style.display==='none' ? '▶' : '▼';
    });

    section.appendChild(header);
    section.appendChild(body);
    container.appendChild(section);
  });

  container.querySelectorAll('input[type="checkbox"][data-feature]').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const fid=e.target.dataset.feature;
      syncFeatureSelection(fid,e.target.checked);
    });
  });

  container.querySelectorAll('input[type="checkbox"][data-cat]').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const catId=e.target.dataset.cat;
      const cat=categories.find(c=>c.id===catId);
      cat.features.forEach(f=>{
        if(e.target.checked) selectedFeatures.add(f.id);
        else selectedFeatures.delete(f.id);
      });
      updateCheckboxes();
      updateUI();
    });
  });
}

document.getElementById('presetSelect').addEventListener('change',e=>{
  const preset=devicePresets.find(p=>p.id===e.target.value);
  if(!preset) return;
  selectedFeatures.clear();
  preset.defaultFeatures.forEach(fid=>selectedFeatures.add(fid));
  updateCheckboxes();
  updateUI();
});

document.getElementById('toggleExpand').addEventListener('click',()=>{
  allExpanded=!allExpanded;
  document.querySelectorAll('[data-cat-body]').forEach(div=>{
    div.style.display=allExpanded ? 'block' : 'none';
  });
  document.querySelectorAll('.toggle-icon').forEach(icon=>{
    icon.textContent=allExpanded ? '▼' : '▶';
  });
  document.getElementById('toggleExpand').textContent=allExpanded ? '▲' : '▼';
});

document.getElementById('toggleSelect').addEventListener('click',()=>{
  allSelected=!allSelected;
  if(allSelected){
    categories.forEach(cat=>{
      cat.features.forEach(f=>selectedFeatures.add(f.id));
    });
  } else {
    selectedFeatures.clear();
  }
  updateCheckboxes();
  updateUI();
  document.getElementById('toggleSelect').textContent=allSelected ? '☑' : '☐';
});

document.getElementById('exportBtn').addEventListener('click',()=>{
  const features=Array.from(selectedFeatures);
  const packages=[];
  features.forEach(fid=>{
    const feature=categories.flatMap(c=>c.features).find(f=>f.id===fid);
    if(feature){
      feature.requiredPackages.forEach(pkg=>{
        if(!packages.includes(pkg)) packages.push(pkg);
