function updateCategoryCheckboxStates() {
  categories.forEach(cat => {
    const catCheckbox = document.querySelector(`input[type="checkbox"][data-cat='${cat.id}']`);
    if (!catCheckbox) return;
    const allFeatureIds = cat.features.map(f => f.id);
    const checkedCount = allFeatureIds.filter(fid => selectedFeatures.has(fid)).length;
    catCheckbox.checked = checkedCount === allFeatureIds.length;
    catCheckbox.indeterminate = checkedCount > 0 && checkedCount < allFeatureIds.length;
  });
}

function updateUI() {
  const featureUl = document.getElementById('selectedFeatures');
  const packageUl = document.getElementById('packageList');
  const depUl = document.getElementById('dependencyList');
  const statusText = document.getElementById('statusText');

  featureUl.innerHTML = '';
  packageUl.innerHTML = '';
  depUl.innerHTML = '';

  const packages = new Set();
  selectedFeatures.forEach(fid => {
    const feature = categories.flatMap(c => c.features).find(f => f.id === fid);
    if (feature) {
      featureUl.innerHTML += `<li>${feature.name}</li>`;
      feature.requiredPackages.forEach(pkg => packages.add(pkg));
    }
  });

  let totalSize = 0;
  packages.forEach(pkg => {
    packageUl.innerHTML += `<li>${pkg}</li>`;
    (packageDependencies[pkg] || []).forEach(dep => {
      depUl.innerHTML += `<li>${pkg} → ${dep}</li>`;
    });
    totalSize += 5;
  });

  document.getElementById('imageSize').innerText = `${totalSize} MB`;
  const totalFeatures = categories.reduce((acc, c) => acc + c.features.length, 0);
  const totalPackages = Object.keys(packageDependencies).length;
  statusText.innerText = `${selectedFeatures.size} / ${totalFeatures} features selected | ${packages.size} / ${totalPackages} packages`;

  updateCategoryCheckboxStates();
  drawGraph(packages);
}

function drawGraph(pkgs) {
  const nodes = [], edges = [];
  const added = new Set();
  pkgs.forEach(pkg => {
    if (!added.has(pkg)) {
      nodes.push({ id: pkg, label: pkg });
      added.add(pkg);
    }
    (packageDependencies[pkg] || []).forEach(dep => {
      if (!added.has(dep)) {
        nodes.push({ id: dep, label: dep });
        added.add(dep);
      }
      edges.push({ from: pkg, to: dep });
    });
  });

  const container = document.getElementById('graph');
  const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
  new vis.Network(container, data, {
    nodes: { shape: 'box' },
    physics: { enabled: true }
  });
}

function renderFeatureList() {
  const container = document.getElementById('featureList');
  container.innerHTML = '';

  categories.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'mb-4';

    const header = document.createElement('div');
    header.className = 'flex items-center justify-between cursor-pointer';
    header.innerHTML = `<div class="flex items-center space-x-2">
      <span class="toggle-icon">${allExpanded ? '▼' : '▶'}</span>
      <span>${cat.icon}</span>
      <span class="font-medium">${cat.name}</span>
    </div>
    <input type="checkbox" data-cat="${cat.id}" />`;

    const body = document.createElement('div');
    body.className = 'ml-6 mt-2 space-y-1';
    body.dataset.catBody = cat.id;
    body.style.display = allExpanded ? 'block' : 'none';

    cat.features.forEach(f => {
      const row = document.createElement('div');
      row.className = 'flex items-center justify-between';
      row.innerHTML = `<div class="flex items-center space-x-2">
        <span>${f.icon}</span><span>${f.name}</span>
      </div>
      <input type="checkbox" data-feature="${f.id}" />`;
      body.appendChild(row);
    });

    header.querySelector('.toggle-icon').addEventListener('click', () => {
      const current = body.style.display;
      body.style.display = current === 'none' ? 'block' : 'none';
      header.querySelector('.toggle-icon').textContent = body.style.display === 'none' ? '▶' : '▼';
    });

    section.appendChild(header);
    section.appendChild(body);
    container.appendChild(section);
  });

  container.querySelectorAll('input[type="checkbox"][data-feature]').forEach(cb => {
    cb.addEventListener('change', e => {
      const fid = e.target.dataset.feature;
      if (e.target.checked) selectedFeatures.add(fid);
      else selectedFeatures.delete(fid);
      updateUI();
    });
  });

  container.querySelectorAll('input[type="checkbox"][data-cat]').forEach(cb => {
    cb.addEventListener('change', e => {
      const catId = e.target.dataset.cat;
      const cat = categories.find(c => c.id === catId);
      cat.features.forEach(f => {
        const input = container.querySelector(`input[data-feature='${f.id}']`);
        input.checked = e.target.checked;
        if (e.target.checked) selectedFeatures.add(f.id);
        else selectedFeatures.delete(f.id);
      });
      updateUI();
    });
  });
}


document.getElementById('presetSelect').addEventListener('change', e => {
  const preset = devicePresets.find(p => p.id === e.target.value);
  if (!preset) return;
  selectedFeatures.clear();
  preset.defaultFeatures.forEach(fid => selectedFeatures.add(fid));
  document.querySelectorAll('input[type="checkbox"][data-feature]').forEach(cb => {
    cb.checked = selectedFeatures.has(cb.dataset.feature);
  });
  updateUI();
});

document.getElementById('toggleExpand').addEventListener('click', () => {
  allExpanded = !allExpanded;
  document.querySelectorAll('[data-cat-body]').forEach(div => {
    div.style.display = allExpanded ? 'block' : 'none';
  });
  document.querySelectorAll('.toggle-icon').forEach(icon => {
    icon.textContent = allExpanded ? '▼' : '▶';
  });
  document.getElementById('toggleExpand').textContent = allExpanded ? '▲' : '▼';
});

document.getElementById('toggleSelect').addEventListener('click', () => {
  allSelected = !allSelected;
  document.querySelectorAll('input[type="checkbox"][data-feature]').forEach(cb => {
    cb.checked = allSelected;
    const fid = cb.dataset.feature;
    if (allSelected) selectedFeatures.add(fid);
    else selectedFeatures.delete(fid);
  });
  updateUI();
  document.getElementById('toggleSelect').textContent = allSelected ? '☑' : '☐';
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const features = Array.from(selectedFeatures);
  const packages = [];
  features.forEach(fid => {
    const feature = categories.flatMap(c => c.features).find(f => f.id === fid);
    if (feature) {
      feature.requiredPackages.forEach(pkg => {
        if (!packages.includes(pkg)) packages.push(pkg);
      });
    }
  });

  const deps = [];
  packages.forEach(pkg => {
    (packageDependencies[pkg] || []).forEach(dep => {
      deps.push({ from: pkg, to: dep });
    });
  });

  const exportData = {
    selectedFeatures: features,
    requiredPackages: packages,
    dependencies: deps
  };

  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'webos_selection.json';
  a.click();
  URL.revokeObjectURL(url);
});

renderFeatureList();
updateUI();
</script>
</body>
</html>
